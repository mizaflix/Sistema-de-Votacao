<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Identificação - Votação</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body {
      background: linear-gradient(135deg, #49886e, #689d5c);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Poppins', sans-serif;
    }

    .cpf-container {
      background: white;
      color: #333;
      padding: 30px 40px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      text-align: center;
      width: 90%;
      max-width: 380px;
    }

    h1 {
      color: #49886e;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-bottom: 20px;
      text-align: center;
      font-size: 1.1em;
    }

    button {
      background: #49886e;
      color: white;
      border: none;
      padding: 10px 25px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.1em;
      font-weight: bold;
      transition: background 0.3s;
    }

    button:hover {
      background: #356a52;
    }

    .erro {
      color: red;
      margin-top: 10px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="cpf-container">
    <h1>Digite seu CPF para votar</h1>
    <input type="text" id="cpf" placeholder="Digite seu CPF">
    <button onclick="verificarCPF()">Entrar</button>
    <p id="mensagem" class="erro"></p>
  </div>

  <script>
    async function verificarCPF() {
      const cpf = document.getElementById('cpf').value.trim();
      const mensagem = document.getElementById('mensagem');

      if (!cpf) {
        mensagem.textContent = 'Digite o CPF.';
        return;
      }

      const resp = await fetch('/verificar_cpf', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({cpf})
      });

      const dados = await resp.json();

      if (resp.ok) {
        window.location.href = '/';
      } else {
        mensagem.textContent = dados.erro || 'Erro ao verificar CPF.';
      }
    }
  </script>
</body>
</html>
