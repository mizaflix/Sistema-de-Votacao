<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Votação</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* Estilos para a tela de login (centrada) */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #94d2bd, #e9d8a6);
        }
        .cpf-modal {
            background: #fff;
            padding: 30px 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
        }
        .cpf-modal h2 {
            margin-top: 0;
            color: #333;
        }
        .cpf-modal input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1.2em;
            box-sizing: border-box; 
            text-align: center;
        }
        .cpf-modal button {
            background-color: #49886e;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: background 0.3s;
            width: 100%; /* Botão a 100% */
        }
        .cpf-modal button:hover {
            background-color: #3a7553;
        }
        #cpf-erro {
            color: #d9534f;
            font-weight: bold;
            margin-top: 10px;
            height: 20px; /* Para não "saltar" */
        }
    </style>
</head>
<body>

    <div class="cpf-modal">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="logo" style="width: 60px; height: 60px; margin-bottom: 10px;">
        <h2>Identificação do Eleitor</h2>
        <p>Por favor, digite seu CPF (apenas números) para votar.</p>
        <input type="tel" id="cpfInput" placeholder="Digite seu CPF" autocomplete="off">
        <button id="cpfBtn">Aceder</button>
        <div id="cpf-erro"></div>
    </div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const cpfInput = document.getElementById('cpfInput');
    const cpfBtn = document.getElementById('cpfBtn');
    const cpfErro = document.getElementById('cpf-erro');

    cpfBtn.addEventListener('click', verificarCPF);
    cpfInput.addEventListener('keyup', function(e) {
        if (e.key === 'Enter') {
            verificarCPF();
        }
    });

    async function verificarCPF() {
        const cpf = cpfInput.value.trim();
        if (!cpf) {
            cpfErro.textContent = "Por favor, digite o seu CPF.";
            return;
        }

        cpfBtn.disabled = true;
        cpfBtn.textContent = "A verificar...";
        cpfErro.textContent = "";

        try {
            const resposta = await fetch('/verificar_cpf', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ cpf: cpf })
            });

            const dados = await resposta.json();

            if (resposta.ok) {
                // Sucesso! Redireciona para a página de votação
                window.location.href = '/'; // Redireciona para o index
            } else {
                // Erro (CPF não existe, já votou, etc.)
                cpfErro.textContent = dados.erro || "Erro desconhecido.";
            }
        } catch (err) {
            cpfErro.textContent = "Não foi possível ligar ao servidor.";
            console.error(err);
        }

        cpfBtn.disabled = false;
        cpfBtn.textContent = "Aceder";
    }
});
</script>

</body>
</html>
