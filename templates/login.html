<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login - Admin IPJardim</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #49886e, #689d5c);
      font-family: 'Poppins', sans-serif;
    }
    .login-box {
      background: white;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      text-align: center;
      width: 320px;
    }
    h2 { color: #49886e; margin-bottom: 20px; }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1em;
    }
    button {
      width: 100%;
      background: #49886e;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s;
    }
    button:hover { background: #3a7553; }
    .erro {
      color: #e63946;
      font-weight: bold;
      margin-top: 10px;
    }
    .logout {
      margin-top: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Login - Admin</h2>
    <form method="POST">
      <input type="text" name="usuario" placeholder="Usuário" required>
      <input type="password" name="senha" placeholder="Senha" required>
      <button type="submit">Entrar</button>
    </form>
    {% if erro %}
      <p class="erro">{{ erro }}</p>
    {% endif %}
  </div>
</body>
</html>
