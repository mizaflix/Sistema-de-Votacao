<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Votação</title>
    <!-- Link para o seu CSS. Garanta que o caminho está correto. -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* Estilos rápidos para o avatar padrão e feedback */
        .foto-padrao {
            width: 120px;
            height: 120px;
            border-radius: 8px;
            background: #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #555;
            font-size: 1.1em;
            font-weight: bold;
        }
        .foto-candidato {
            width: 120px;
            height: 120px;
            border-radius: 8px;
            object-fit: cover; /* Garante que a foto não fique distorcida */
        }
    </style>
</head>
<body>

<!-- === CONTEÚDO PRINCIPAL (Votação) === -->
<div class="votacao-container" id="votacaoContainer">
    <header>
        <div class="logo-container">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="logo" onerror="this.style.display='none'">
        </div>
        <h1>Sistema de Votação</h1>
        <div class="admin-link" style="width: 50px;"></div> <!-- Espaço vazio para alinhar -->
    </header>

    <main>
        <h2 id="titulo-turno">Votação: {{ turno_atual }}</h2>
        <p id="contador">Selecione até 4 candidatos. (Selecionados: <span id="numSelecionados">0</span>)</p>
        
        <!-- Grelha de Candidatos -->
        <div class="grid" id="gridCandidatos">
            
            <!-- Os candidatos são renderizados pelo Flask -->
            {% for candidato in candidatos %}
            <div class="card {% if candidato.nome.lower() == 'voto nulo' %}card-nulo{% endif %}" 
                 data-nome="{{ candidato.nome }}" 
                 tabindex="0"> <!-- tabindex para acessibilidade -->
                
                <!-- 
                Verifica se 'candidato.foto' existe. Se não (como no Voto Nulo), 
                mostra um 'div' padrão em vez de um 'img' quebrado.
                -->
                {% if candidato.foto %}
                    <img src="{{ url_for('static', filename=candidato.foto) }}" 
                         alt="Foto de {{ candidato.nome }}" 
                         class="foto-candidato"
                         onerror="this.onerror=null; this.src='{{ url_for('static', filename='logo.png') }}';"> <!-- Fallback caso a foto não carregue -->
                {% else %}
                    <!-- Avatar Padrão para 'Voto Nulo' ou quem não tem foto -->
                    <div class="foto-padrao">
                        <span>{{ candidato.nome }}</span>
                    </div>
                {% endif %}
                
                <div class="nome-candidato">{{ candidato.nome }}</div>
            </div>
            {% endfor %}
            
        </div>

        <button id="confirmar">Confirmar Voto(s)</button>
    </main>
</div>

<!-- Modal de Confirmação (igual ao do admin.html) -->
<div class="modal-overlay" id="modalConfirmacao">
    <div class="modal">
        <h2>Confirmar Votos</h2>
        <p id="listaVotosConfirmar"></p>
        <p>Tem a certeza que deseja submeter estes votos?</p>
        <button class="btn-confirmar" id="btnConfirmarFinal">Sim, Confirmar</button>
        <button class="btn-cancelar" id="btnCancelarFinal">Cancelar</button>
    </div>
</div>

<!-- Toast (igual ao do admin.html) -->
<div class="toast" id="toast"></div>


<script>
document.addEventListener("DOMContentLoaded", function() {

    const votacaoContainer = document.getElementById('votacaoContainer');
    const gridCandidatos = document.getElementById('gridCandidatos');
    const btnConfirmar = document.getElementById('confirmar');
    const spanSelecionados = document.getElementById('numSelecionados');
    
    const modalConfirmacao = document.getElementById('modalConfirmacao');
    const listaVotosConfirmar = document.getElementById('listaVotosConfirmar');
    const btnConfirmarFinal = document.getElementById('btnConfirmarFinal');
    const btnCancelarFinal = document.getElementById('btnCancelarFinal');

    let selecionados = [];
    const MAX_VOTOS = 4; // Ajustado de 6 para 4
    const NOME_VOTO_NULO = "Voto Nulo"; // Garante que o nome é consistente

    // --- LÓGICA DE VOTAÇÃO ---

    // Event listener para cliques nos cards
    gridCandidatos.addEventListener('click', (e) => {
        const card = e.target.closest('.card');
        if (card) {
            selecionarCard(card);
        }
    });

    // Event listener para navegação por teclado (Acessibilidade)
    gridCandidatos.addEventListener('keydown', (e) => {
        const card = e.target.closest('.card');
        if (card && (e.key === 'Enter' || e.key === ' ')) {
            e.preventDefault(); // Impede a página de rolar com a barra de espaço
            selecionarCard(card);
        }
    });

    // ==========================================================
    // LÓGICA DO VOTO NULO
    // ==========================================================
    function selecionarCard(card) {
        const nome = card.dataset.nome;
        const index = selecionados.indexOf(nome);
        const ehNulo = nome.toLowerCase() === NOME_VOTO_NULO.toLowerCase();

        if (index > -1) {
            // Já estava selecionado -> Desselecionar
            selecionados.splice(index, 1);
            card.classList.remove('selecionado');
        } else {
            // Não estava selecionado -> Tentar selecionar

            if (ehNulo) {
                // Se clicou no Voto Nulo:
                // 1. Desmarca todos os outros
                document.querySelectorAll('.card.selecionado').forEach(c => {
                    c.classList.remove('selecionado');
                });
                // 2. Limpa a lista
                selecionados = [];
                // 3. Adiciona apenas o Voto Nulo
                selecionados.push(nome);
                card.classList.add('selecionado');
                
            } else if (selecionados.includes(NOME_VOTO_NULO)) {
                // Se o Voto Nulo estava selecionado e clicou noutro:
                // 1. Remove o Voto Nulo da lista
                selecionados = [];
                // 2. Desmarca o card do Voto Nulo
                const cardNulo = document.querySelector('.card-nulo');
                if (cardNulo) {
                    cardNulo.classList.remove('selecionado');
                }
                // 3. Adiciona o candidato clicado
                selecionados.push(nome);
                card.classList.add('selecionado');

            } else if (selecionados.length < MAX_VOTOS) {
                // Caso normal (nem é nulo, nem nulo estava selecionado)
                // Adiciona se houver espaço
                selecionados.push(nome);
                card.classList.add('selecionado');
            } else {
                // Limite atingido
                mostrarToast(`Só pode selecionar até ${MAX_VOTOS} candidatos.`, 'erro');
            }
        }
        
        // Atualiza a contagem
        spanSelecionados.textContent = selecionados.length;
    }


    // Botão Confirmar (abre o modal)
    btnConfirmar.addEventListener('click', () => {
        if (selecionados.length === 0) {
            mostrarToast("Deve selecionar pelo menos 1 candidato.", 'erro');
            return;
        }
        
        // Preenche o modal com os votos
        listaVotosConfirmar.innerHTML = "<strong>Votos selecionados:</strong><br>" + selecionados.join(', ');
        modalConfirmacao.style.display = 'flex';
    });

    // Botões do Modal
    btnCancelarFinal.addEventListener('click', () => {
        modalConfirmacao.style.display = 'none';
    });

    btnConfirmarFinal.addEventListener('click', async () => {
        btnConfirmarFinal.disabled = true;
        btnConfirmarFinal.textContent = "A guardar...";

        try {
            const resposta = await fetch('/votar', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ votos: selecionados })
            });

            const dados = await resposta.json();

            if (resposta.ok) {
                // Sucesso!
                modalConfirmacao.style.display = 'none';
                // Mostra mensagem de sucesso e redireciona
                votacaoContainer.innerHTML = `
                    <div style="text-align: center; padding-top: 50px;">
                        <h1 style='color:#49886e; margin-top: 40px;'>Obrigado!</h1>
                        <p style='font-size: 1.2em;'>${dados.mensagem}</p>
                        <p>A redirecionar para a tela inicial...</p>
                    </div>
                `;
                // Redireciona de volta para a tela de login
                setTimeout(() => {
                    window.location.href = '/login-codigo'; // Atualizado para a nova rota de login por código
                }, 4000); // 4 segundos

            } else {
                // Erro (Ex: sessão expirou, votou entretanto)
                mostrarToast(dados.mensagem || "Erro ao submeter.", 'erro');
                btnConfirmarFinal.disabled = false;
                btnConfirmarFinal.textContent = "Sim, Confirmar";
                modalConfirmacao.style.display = 'none';
            }

        } catch (err) {
            mostrarToast("Não foi possível ligar ao servidor.", 'erro');
            console.error(err);
            btnConfirmarFinal.disabled = false;
            btnConfirmarFinal.textContent = "Sim, Confirmar";
            modalConfirmacao.style.display = 'none';
        }
    });

    // Função de Toast (para mostrar mensagens)
    function mostrarToast(mensagem, tipo = 'info') {
        const toast = document.getElementById('toast');
        toast.textContent = mensagem;
        toast.className = 'toast mostrar ' + tipo; // Adiciona tipo (sucesso, erro, info)
        setTimeout(() => {
            toast.className = toast.className.replace('mostrar', '');
        }, 3000);
    }
});
</script>

</body>
</html>
