<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ELEIÇÕES - IPJARDIM</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
   <!-- Cabeçalho -->
    <header>
       <div class="logo-container">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="logo">
        </div>
        <h1>ELEIÇÕES - IPJARDIM</h1>
        <a href="/admin" class="admin-link">Admin</a>
    </header>

  <main>
    <p id="contador">Você pode escolher até 6 candidatos (0/6)</p>

    <div class="grid">
  {% for candidato in candidatos %}
  {% if candidato.nome != "Voto Nulo" %}
  <div class="card" onclick="toggleVoto('{{ candidato.nome }}', this)">
    <img class="foto" src="{{ url_for('static', filename=candidato.foto) }}" alt="{{ candidato.nome }}">
  </div>
  {% endif %}
  {% endfor %}
  
  <!-- Voto Nulo separado -->
  <div class="card-nulo" onclick="toggleVoto('NULO', this)">
    <div>VOTO NULO</div>
  </div>
</div>

    <button id="confirmar" onclick="abrirModal()">CONFIRMAR VOTO</button>
    <div id="toast" class="toast"></div>
  </main>

  <!-- Modal de confirmação -->
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal">
      <h2>Confirmar Voto</h2>
      <p id="modalTexto">Deseja confirmar seus votos?</p>
      <button class="btn-confirmar" onclick="confirmarVotos()">Confirmar</button>
      <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
    </div>
  </div>

  <audio id="somConfirmar" src="{{ url_for('static', filename='voto.mp3') }}"></audio>

<script>
let votosSelecionados = [];

// Se o servidor marcar que já tem sessão, não exibir overlay.
// Mas como estamos servindo a página somente depois de sessão, o overlay atuará quando necessário.
// A rota /cpf redireciona pra mim se não houver sessão; aqui o overlay dá fallback se index for usado diretamente.

function toggleVoto(nome, elemento) {
  const nuloCard = document.querySelector('.card-nulo');
  const isNulo = nome === 'NULO';

  // Se clicou em "Voto Nulo"
  if (isNulo) {
    // Desmarca todos os outros candidatos
    document.querySelectorAll('.card').forEach(c => c.classList.remove('selecionado'));
    votosSelecionados = ['NULO'];
    elemento.classList.add('selecionado');
    if (nuloCard) nuloCard.classList.add('selecionado');
  } else {
    // Se "Voto Nulo" estava selecionado, remove
    if (votosSelecionados.includes('NULO')) {
      votosSelecionados = [];
      if (nuloCard) nuloCard.classList.remove('selecionado');
    }

    const idx = votosSelecionados.indexOf(nome);
    if (idx === -1) {
      if (votosSelecionados.length >= 6) {
        alert('Você só pode votar em até 6 candidatos!');
        return;
      }
      votosSelecionados.push(nome);
      elemento.classList.add('selecionado');
    } else {
      votosSelecionados.splice(idx, 1);
      elemento.classList.remove('selecionado');
    }
  }

  document.getElementById('contador').innerText =
    votosSelecionados.includes('NULO')
      ? 'Você selecionou voto NULO.'
      : `Você pode escolher até 6 candidatos (${votosSelecionados.length}/6)`;
}

// === MODAL ===
function abrirModal() {
  if (votosSelecionados.length === 0) {
    mostrarAlerta('Selecione ao menos um candidato ou o voto NULO.', 'erro');
    return;
  }
  const modalTexto = document.getElementById('modalTexto');
  modalTexto.innerText = `Confirmar votos em: ${votosSelecionados.join(', ')}?`;
  document.getElementById('modalOverlay').style.display = 'flex';
}

function fecharModal() {
  document.getElementById('modalOverlay').style.display = 'none';
}

// === CONFIRMAR VOTO ===
async function confirmarVotos() {
  fecharModal();
  const resp = await fetch('/votar', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ votos: votosSelecionados })
  });

  const dados = await resp.json();

  if (resp.ok) {
    mostrarAlerta(dados.mensagem, 'sucesso');
    const som = document.getElementById("somConfirmar");
    som.currentTime = 0;
    som.play();

    // Espera o áudio terminar antes de resetar
    som.onended = () => {
      votosSelecionados = [];
      document.querySelectorAll('.card').forEach(c => c.classList.remove('selecionado'));
      document.getElementById('contador').innerText = 'Você pode escolher até 6 candidatos (0/6)';
      // Após o áudio, volta pra tela de CPF
      window.location.href = "/cpf";
    };
  } else {
    mostrarAlerta('Erro ao enviar votos.', 'erro');

    // se for erro de sessão, redireciona para a tela de CPF
    if (resp.status === 403) {
      setTimeout(() => { window.location.href = '/cpf'; }, 1200);
    }
  }
}

function tocarSomConfirmacao() {
  const som = document.getElementById("somConfirmar");
  som.currentTime = 0;
  som.play();
}

// === TOAST BONITO ===
function mostrarAlerta(mensagem, tipo = "info") {
  const toast = document.getElementById("toast");
  toast.textContent = mensagem;
  toast.className = `toast mostrar ${tipo}`;
  setTimeout(() => {
    toast.className = "toast";
  }, 3000);
}


// ================= CPF overlay logic =================
async function enviarCPF() {
  const cpf = document.getElementById('cpfInput').value.trim();
  const msgEl = document.getElementById('cpfMsg');
  msgEl.textContent = '';

  if (!cpf) {
    msgEl.textContent = 'Digite um CPF.';
    return;
  }

  // Chama backend pra verificar
  try {
    const resp = await fetch('/verificar_cpf', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ cpf })
    });
    const data = await resp.json();
    if (resp.ok) {
      // sucesso: fecha overlay e permite votar
      const overlay = document.getElementById('cpfOverlay');
      overlay.style.display = 'none';
      mostrarAlerta('CPF aceito. Você já pode votar.', 'sucesso');
    } else {
      msgEl.textContent = data.erro || 'CPF inválido ou já votou.';
    }
  } catch (err) {
    msgEl.textContent = 'Erro ao verificar CPF.';
  }
}

// Se a página for carregada diretamente (sem passar por /cpf), o overlay aparece.
// Caso contrário, o servidor redirecione para /cpf e essa página não é exibida.

</script>

<style>
/* estilos rápidos pro overlay cpf (você pode mover pro style.css se quiser) */
.cpf-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10,10,10,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}
.cpf-card {
  background: white;
  padding: 22px;
  border-radius: 10px;
  text-align: center;
  width: 320px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.2);
}
.cpf-card input { width: 100%; padding: 10px; border-radius:6px; border:1px solid #ccc; }
</style>

</body>
</html>
