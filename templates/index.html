<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ELEIÇÕES - IPJARDIM</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
   <!-- Cabeçalho -->
    <header>
       <div class="logo-container">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="logo">
        </div>
        <h1>ELEIÇÕES - IPJARDIM</h1>
        <a href="/admin" class="admin-link">Admin</a>
    </header>

  <main>
    <p id="contador">Você pode escolher até 6 candidatos (0/6)</p>

    <div class="grid">
      {% for candidato in candidatos %}
      <div class="card" onclick="toggleVoto('{{ candidato }}', this)">
        <div class="foto">Foto candidato</div>
        <p>{{ candidato }}</p>
      </div>
      {% endfor %}
    </div>

    <button id="confirmar" onclick="confirmarVotos()">CONFIRMAR VOTO</button>
  </main>

<script>
let votosSelecionados = [];

function toggleVoto(nome, elemento) {
  const idx = votosSelecionados.indexOf(nome);
  if (idx === -1) {
    if (votosSelecionados.length >= 6) {
      alert('Você só pode votar em até 6 candidatos!');
      return;
    }
    votosSelecionados.push(nome);
    elemento.classList.add('selecionado');
  } else {
    votosSelecionados.splice(idx, 1);
    elemento.classList.remove('selecionado');
  }
  document.getElementById('contador').innerText = `Você pode escolher até 6 candidatos (${votosSelecionados.length}/6)`;
}

async function confirmarVotos() {
  const confirmar = confirm(`Confirmar votos em: ${votosSelecionados.join(', ')}?`);
  if (!confirmar) return;

  const resp = await fetch('/votar', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({votos: votosSelecionados})
  });
  const dados = await resp.json();
  alert(dados.mensagem);
  if (resp.ok) {
    // limpar seleção
    votosSelecionados = [];
    document.querySelectorAll('.card').forEach(c => c.classList.remove('selecionado'));
    document.getElementById('contador').innerText = 'Você pode escolher até 6 candidatos (0/6)';
  }
}
</script>
</body>
</html>
