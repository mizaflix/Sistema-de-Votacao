<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ELEIÇÕES - IPJARDIM</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
   <!-- Cabeçalho -->
    <header>
       <div class="logo-container">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="logo">
        </div>
        <h1>ELEIÇÕES - IPJARDIM</h1>
        <a href="/admin" class="admin-link">Admin</a>
    </header>

  <main>

    <div class="grid">
  {% for candidato in candidatos %}
  {% if candidato.nome != "Voto Nulo" %}
  <div class="card" onclick="toggleVoto('{{ candidato.nome }}', this)">
    <img class="foto" src="{{ url_for('static', filename=candidato.foto) }}" alt="{{ candidato.nome }}">
  </div>
  {% endif %}
  {% endfor %}
  
  <!-- Voto Nulo separado -->
  <div class="card-nulo" onclick="toggleVoto('NULO', this)">
    <div>VOTO NULO</div>
  </div>
</div>

    <button id="confirmar" onclick="abrirModal()">CONFIRMAR VOTO</button>
    <div id="toast" class="toast"></div>
  </main>

  <!-- Modal de confirmação -->
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal">
      <h2>Confirmar Voto</h2>
      <p id="modalTexto">Deseja confirmar seus votos?</p>
      <button class="btn-confirmar" onclick="confirmarVotos()">Confirmar</button>
      <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
    </div>
  </div>

  <audio id="somConfirmar" src="{{ url_for('static', filename='voto.mp3') }}"></audio>

<script>
let votosSelecionados = [];

function toggleVoto(nome, elemento) {
  const nuloCard = document.querySelector('.card-nulo');
  const isNulo = nome === 'NULO';

  // Se clicou em "Voto Nulo"
  if (isNulo) {
    // Desmarca todos os outros candidatos
    document.querySelectorAll('.card').forEach(c => c.classList.remove('selecionado'));
    votosSelecionados = ['NULO'];
    elemento.classList.add('selecionado');
  } else {
    // Se "Voto Nulo" estava selecionado, remove
    if (votosSelecionados.includes('NULO')) {
      votosSelecionados = [];
      nuloCard.classList.remove('selecionado');
    }

    const idx = votosSelecionados.indexOf(nome);
    if (idx === -1) {
      if (votosSelecionados.length >= 6) {
        alert('Você só pode votar em até 6 candidatos!');
        return;
      }
      votosSelecionados.push(nome);
      elemento.classList.add('selecionado');
    } else {
      votosSelecionados.splice(idx, 1);
      elemento.classList.remove('selecionado');
    }
  }

  document.getElementById('contador').innerText =
    votosSelecionados.includes('NULO')
      ? 'Você selecionou voto NULO.'
      : `Você pode escolher até 6 candidatos (${votosSelecionados.length}/6)`;
}

// === MODAL ===
function abrirModal() {
  if (votosSelecionados.length === 0) {
    mostrarAlerta('Selecione ao menos um candidato ou o voto NULO.', 'erro');
    return;
  }
  const modalTexto = document.getElementById('modalTexto');
  modalTexto.innerText = `Confirmar votos em: ${votosSelecionados.join(', ')}?`;
  document.getElementById('modalOverlay').style.display = 'flex';
}

function fecharModal() {
  document.getElementById('modalOverlay').style.display = 'none';
}

// === CONFIRMAR VOTO ===
async function confirmarVotos() {
  fecharModal();
  const resp = await fetch('/votar', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ votos: votosSelecionados })
  });
  

  const dados = await resp.json();
  if (resp.ok) {
    mostrarAlerta(dados.mensagem, 'sucesso');
    tocarSomConfirmacao();
    votosSelecionados = [];
    document.querySelectorAll('.card').forEach(c => c.classList.remove('selecionado'));
    document.getElementById('contador').innerText = 'Você pode escolher até 6 candidatos (0/6)';
  } else {
    mostrarAlerta('Erro ao enviar votos.', 'erro');
  }
}

function tocarSomConfirmacao() {
  const som = document.getElementById("somConfirmar");
  som.currentTime = 0;
  som.play();
}

// === TOAST BONITO ===
function mostrarAlerta(mensagem, tipo = "info") {
  const toast = document.getElementById("toast");
  toast.textContent = mensagem;
  toast.className = `toast mostrar ${tipo}`;
  setTimeout(() => {
    toast.className = "toast";
  }, 3000);
}

</script>
</body>
</html>
